{{- range $name, $svc := .Values.services }}
{{- if dig "autoscaling" "enabled" false $svc }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "flightdeck.serviceName" $ctx }}
  labels:
    {{- include "flightdeck.labels" $ | nindent 4 }}
    {{- include "flightdeck.selectorLabels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "flightdeck.serviceName" $ctx }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
