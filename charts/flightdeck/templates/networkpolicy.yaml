{{- if .Values.networkPolicy.enabled }}
{{- /*
NetworkPolicies are additive. Together these mean: every pod in the
namespace accepts traffic from the namespace; only the gateway also accepts
it from anywhere; the app services' http port is open to the metrics
namespace so Prometheus can scrape them.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flightdeck.fullname" . }}-same-namespace
  labels:
    {{- include "flightdeck.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flightdeck.serviceName" (dict "root" . "name" "gateway") }}-public
  labels:
    {{- include "flightdeck.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flightdeck.selectorLabels" (dict "root" . "name" "gateway") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
{{- with .Values.networkPolicy.metricsNamespace }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flightdeck.fullname" $ }}-metrics-scrape
  labels:
    {{- include "flightdeck.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          {{- range $name, $_ := $.Values.services }}
          - {{ $name }}
          {{- end }}
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ $.Release.Name }}]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
{{- end }}
