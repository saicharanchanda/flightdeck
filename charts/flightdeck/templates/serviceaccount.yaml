{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flightdeck.serviceName" $ctx }}
  labels:
    {{- include "flightdeck.labels" $ | nindent 4 }}
    {{- include "flightdeck.selectorLabels" $ctx | nindent 4 }}
# None of the services call the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
