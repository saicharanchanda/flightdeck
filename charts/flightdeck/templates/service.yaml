{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flightdeck.serviceName" $ctx }}
  labels:
    {{- include "flightdeck.labels" $ | nindent 4 }}
    {{- include "flightdeck.selectorLabels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "flightdeck.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
{{- end }}
