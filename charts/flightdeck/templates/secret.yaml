{{- /*
DB and Redis credentials, shared with the postgresql and redis subcharts via
their existingSecret settings. Each key is, in order: the value from values,
the value already in the cluster (so upgrades never rotate it), or a new
random password on first install.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.db.secretName }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data }}{{ end }}
{{- $keys := dict "password" .Values.db.password "postgres-password" .Values.db.adminPassword "redis-password" .Values.db.redisPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.db.secretName }}
  labels:
    {{- include "flightdeck.labels" . | nindent 4 }}
  annotations:
    # Keep on uninstall: the retained PVCs were initialised with these passwords.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := $keys }}
  {{- if $value }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- else if hasKey $data $key }}
  {{ $key }}: {{ index $data $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- end }}
