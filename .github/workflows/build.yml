name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: libs/svckit/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Chart SQL matches db/
        run: diff -ru db charts/flightdeck/files/db

      - name: go vet
        run: |
          for m in libs/svckit apps/gateway apps/flights apps/notifier; do
            echo "::group::vet $m"
            go -C "$m" vet ./...
            echo "::endgroup::"
          done

      - name: go test
        run: |
          for m in libs/svckit apps/gateway apps/flights apps/notifier; do
            echo "::group::test $m"
            go -C "$m" test ./...
            echo "::endgroup::"
          done

  image:
    name: image (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, flights, notifier]
    steps:
      - uses: actions/checkout@v5

      # GHCR image names must be lowercase; tag with the 7-char short SHA of
      # the commit being built (the PR head, not the merge commit, on PRs).
      - name: Image name and short SHA
        id: vars
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flightdeck-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.vars.outputs.sha }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@v4

      # PRs build only: fork PRs never get packages:write, and PR images
      # would clutter the registry.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Rebuilds each image from the cache the image job just warmed (so PRs,
  # which don't push, are scanned too). Fails on CRITICAL vulnerabilities
  # that have a fix; every finding goes to code scanning on pushes to main.
  scan:
    name: scan (${{ matrix.service }})
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, flights, notifier]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build for scanning (from cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          load: true
          push: false
          tags: flightdeck-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Trivy — fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flightdeck-${{ matrix.service }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy — full report (SARIF)
        if: always() && github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flightdeck-${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Upload to code scanning
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
