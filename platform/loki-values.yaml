# grafana/loki 7.3.0 (Loki 3.6.12), release "loki" in namespace "monitoring".
#   make platform-logging
#
# SingleBinary: one pod runs every Loki component against a local filesystem
# store. The chart defaults to SimpleScalable (9 pods) plus memcached caches
# that reserve 9Gi — none of which fits this cluster.
# Push endpoint for Alloy: http://loki.monitoring.svc.cluster.local:3100

deploymentMode: SingleBinary

loki:
  auth_enabled: false # single tenant ("fake")
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-10-01"
        store: tsdb
        object_store: filesystem
        schema: v13 # required for structured metadata (request_id)
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true
    volume_enabled: true
  # Retention is enforced by the compactor, which must be told to delete.
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false
  ui:
    enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# --- Everything SingleBinary doesn't need --------------------------------------
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false # Alloy and Grafana talk to the loki Service directly
chunksCache:
  enabled: false
resultsCache:
  enabled: false
memcachedExporter:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
ruler:
  enabled: false
sidecar:
  rules:
    enabled: false

# Loki's own metrics into Prometheus.
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false
