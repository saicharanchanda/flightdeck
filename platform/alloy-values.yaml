# grafana/alloy 1.13.1 (Alloy v1.20.1), release "alloy" in namespace "monitoring".
#   make platform-logging
#
# A DaemonSet: each pod tails container logs from its own node's
# /var/log/pods and ships them to Loki.
#
# Labels (indexed, low cardinality): namespace, container, app, pod, and for
# flightdeck services also service + level. request_id stays in the JSON log
# line and is attached as structured metadata — never a label, because one
# label value per request would create one stream per request.

controller:
  type: daemonset

alloy:
  mounts:
    varlog: true # hostPath /var/log -> /var/log (read-only), for /var/log/pods
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # The chart passes this through Helm's tpl, so Alloy's own {{ }} template is
  # escaped below as {{ "{{" }} ... {{ "}}" }}.
  configMap:
    content: |
      // Pods on this node only: each DaemonSet pod tails its own node.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        // /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        forward_to = [loki.write.loki.receiver]

        // Strip the containerd CRI prefix (timestamp, stream, flags).
        stage.cri {}

        // loki.source.file adds the full log path as a label; it changes on
        // every restart/rotation and duplicates namespace/pod/container.
        stage.label_drop {
          values = ["filename"]
        }

        // flightdeck services log slog JSON: lift service + level to labels,
        // request_id to structured metadata.
        stage.match {
          selector = "{namespace=\"flightdeck\", container=~\"gateway|flights|notifier\"}"

          stage.json {
            expressions = {
              service    = "service",
              level      = "level",
              request_id = "request_id",
            }
          }
          // slog emits INFO/WARN/ERROR; normalise so queries use level="error".
          stage.template {
            source   = "level"
            template = "{{ "{{" }} ToLower .Value {{ "}}" }}"
          }
          stage.labels {
            values = {
              service = "",
              level   = "",
            }
          }
          stage.structured_metadata {
            values = {
              request_id = "",
            }
          }
        }
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

configReloader:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# Alloy's own metrics into Prometheus.
serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
