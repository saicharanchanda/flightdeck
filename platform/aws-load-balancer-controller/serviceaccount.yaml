# Pre-created because the chart is installed with serviceAccount.create=false.
# The role-arn annotation is what enables IRSA: EKS's pod identity webhook
# injects a projected OIDC token plus AWS_ROLE_ARN / AWS_WEB_IDENTITY_TOKEN_FILE.
# Trust policy: infra/iam/aws-load-balancer-controller-trust-policy.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-load-balancer-controller
    app.kubernetes.io/part-of: flightdeck-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/eks-practice-aws-load-balancer-controller
    eks.amazonaws.com/sts-regional-endpoints: "true"
